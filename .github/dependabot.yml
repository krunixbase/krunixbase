version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "github-actions"
    allow:
      - dependency-type: "direct"
    ignore:
      - dependency-name: "pkg"
        versions:
          - "1.x"
